[workspace]
members = [
    "crates/core",
    "crates/cli",
    "apps/desktop/src-tauri"
]
resolver = "2"

# Rust 侧版本号单一来源；tauri.conf.json / package.json 由 CI 一致性检查兜底
[workspace.package]
version = "0.1.0"

[profile.dev]
# Fast local compilation
debug = true

[profile.dev.package.oxitun-core]
opt-level = 3

[profile.dev.package."*"]
# Max optimization for crypto/network dependencies
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
