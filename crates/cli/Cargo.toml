[package]
name = "oxitun-cli"
version.workspace = true
edition = "2024"

[dependencies]
oxitun-core = { path = "../core" }
tokio = { version = "1.53.1", features = ["full"] }
clap = { version = "4.5.1", features = ["derive"] }
log = "0.4.34"
env_logger = "0.11.11"
anyhow = "1.0.104"
service-manager = "0.11.0"

[target.'cfg(windows)'.dependencies]
# Windows 服务控制循环：SCM 控制事件桥接（仅 Windows 编译）
windows-service = "0.8"
